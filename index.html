<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubre Tus Talentos y Tu Camino Profesional | Big Horn Academy</title>
<style>
:root{--navy:#0b1f4b;--navy2:#16336e;--ink:#05070d;--mist:#e9eef9;--line:#cfd8ec;--ok:#1f7a4d;--bad:#a12626}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--mist);color:var(--ink);line-height:1.55}
h1,h2,h3,button,.ui{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
main{max-width:800px;margin:auto;padding:12px 10px 50px}

/* PANEL DE CONTROL */
.dash{background:linear-gradient(140deg,#16336e,#0b1f4b 55%,#05070d);color:#fff;border-radius:22px;padding:18px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink)}
.dtop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dtop img.logo{height:64px;background:#fff;border-radius:12px;padding:4px}
.who{flex:1;min-width:210px}
.who h1{margin:0 0 6px;font-size:1.1rem;line-height:1.25}
.who input{width:100%;background:#ffffff1c;border:2px solid #ffffff55;color:#fff;border-radius:10px;padding:7px 10px;font:.95rem "Trebuchet MS",sans-serif}
.who input::placeholder{color:#ffffffaa}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:14px 0}
.tile{background:#ffffff14;border:2px solid #ffffff30;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:76px}
.tile small{display:block;opacity:.8;font:.72rem "Trebuchet MS",sans-serif}
.tile b{font:800 1.35rem "Trebuchet MS",sans-serif;line-height:1.1;display:block}
.tile .bar{height:6px;background:#ffffff30;border-radius:4px;margin-top:6px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .6s}
.ring text{fill:#fff;font:800 15px "Trebuchet MS",sans-serif}
.medals{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;background:#00000040;border-radius:16px;padding:12px 8px}
.medal{width:78px;text-align:center;font:600 .66rem/1.2 "Trebuchet MS",sans-serif;color:#ffffffaa}
.medal .c{width:58px;height:58px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;border:3px dashed #ffffff66;background:#ffffff14}
.medal .c span{filter:grayscale(1);opacity:.35}
.medal.got{color:#fff}
.medal.got .c{border:3px solid #fff;background:#fff;box-shadow:0 0 0 4px #ffffff40;animation:pop .7s}
.medal.got .c span{filter:none;opacity:1}
@keyframes pop{40%{transform:scale(1.25) rotate(-8deg)}}
.go{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.go p{margin:0;flex:1;min-width:180px;font:700 .95rem "Trebuchet MS",sans-serif}
.btn{background:var(--navy);color:#fff;border:0;border-radius:24px;padding:11px 24px;font-weight:700;cursor:pointer;margin-top:14px;font-size:.95rem}
.btn:hover{background:var(--ink)}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.big{background:#fff;color:var(--navy);margin:0;font-size:1rem;box-shadow:0 4px 0 var(--ink)}
.btn.big:hover{background:var(--mist)}

/* HUD fijo */
.hud{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:3px solid var(--ink);transform:translateY(-70px);transition:transform .3s;font:700 .82rem "Trebuchet MS",sans-serif}
.hud.on{transform:none}
.hud img{height:30px;background:#fff;border-radius:6px;padding:2px}
.hud span{flex:1}
.hud button{margin:0;padding:6px 14px;font-size:.8rem;background:#fff;color:var(--navy)}

/* TABLERO */
.board{position:relative;margin-top:22px;border:4px solid var(--ink);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 8px 0 var(--ink)}
#layer{position:absolute;inset:0}
.band{position:absolute;left:0;right:0}
.scn{position:absolute;opacity:.7;pointer-events:none;line-height:1}
.banner{position:absolute;left:50%;transform:translateX(-50%);width:min(88%,540px);background:var(--navy);color:#fff;border:4px solid #fff;outline:4px solid var(--ink);border-radius:18px;padding:8px 14px;display:flex;align-items:center;gap:12px;text-align:left;z-index:2}
.banner .e{font-size:2.1rem}
.banner small{display:block;opacity:.8;font:.7rem "Trebuchet MS",sans-serif}
.banner b{font:800 1.02rem/1.2 "Trebuchet MS",sans-serif}
.node{position:absolute;width:var(--d);height:var(--d);transform:translate(-50%,-50%);border-radius:50%;border:5px solid var(--navy);background:radial-gradient(circle at 35% 30%,#fff,#d5def3);color:var(--navy);font:800 1.15rem "Trebuchet MS",sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 6px 0 var(--ink);z-index:3;transition:transform .2s}
.node:hover:not(.lock){transform:translate(-50%,-50%) scale(1.07)}
.node .sym{font-size:1.45rem}
.node.quiz{border-radius:28%;border-color:var(--ink)}
.node.final{width:calc(var(--d)*1.3);height:calc(var(--d)*1.3);background:radial-gradient(circle at 35% 30%,#fff,#bcc9ea);border-color:#fff;outline:5px solid var(--ink);color:var(--navy)}
.node.final .sym{font-size:2.3rem}
.node.done{background:radial-gradient(circle at 35% 30%,#2f5bc0,#0b1f4b);color:#fff;border-color:var(--ink)}
.node.done::after{content:"✔";position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.node.cur{animation:pulse 1.6s infinite}
.node.lock{border-color:#8c9bc0;background:#e3e9f7;color:#8c9bc0;box-shadow:0 6px 0 #8c9bc0;cursor:not-allowed}
.node.lock .sym{opacity:.55}
.node:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 #0b1f4b66}50%{box-shadow:0 6px 0 var(--ink),0 0 0 16px #0b1f4b00}}
.nl{position:absolute;top:50%;transform:translateY(-50%);width:150px;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:5px 9px;font:700 .72rem/1.25 "Trebuchet MS",sans-serif;color:var(--navy);text-align:left;pointer-events:none;box-shadow:0 3px 0 var(--ink)}
.nl small{display:block;font-weight:400;opacity:.7;font-size:.64rem}
.nl.r{left:calc(100% + 12px)}.nl.l{right:calc(100% + 12px)}
.node.lock .nl{opacity:.6}
.fig{position:absolute;z-index:8;width:var(--fs,84px);height:var(--fs,84px);transform:translate(-50%,-100%);pointer-events:none;transition:left var(--hd,.45s) ease-in-out,top var(--hd,.45s) ease-in-out}
.fig .in{width:100%;height:100%;font-size:60px;line-height:84px;text-align:center;filter:drop-shadow(0 6px 3px #0006)}
.fig img{width:100%;height:100%;object-fit:contain;display:block}
.fig .in.hop{animation:hop var(--hd,.45s) ease-in-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-46px) scale(1.15) rotate(-7deg)}100%{transform:none}}
.cf{position:fixed;top:-16px;width:10px;height:14px;z-index:70;animation:fall 1.9s linear forwards;pointer-events:none;border:1px solid var(--ink)}
@keyframes fall{to{transform:translateY(108vh) rotate(600deg)}}

/* VENTANA */
.overlay{position:fixed;inset:0;background:#05070dcc;display:none;overflow:auto;z-index:40;padding:18px 10px}
.overlay.on{display:block}
.panel{max-width:760px;margin:auto;background:#fff;border-radius:18px;border:3px solid var(--navy);padding:22px 20px;position:relative;outline:0}
.xbtn{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:1rem;cursor:pointer}
.panel h2{margin:0 40px 6px 0;color:var(--navy);font-size:1.25rem}
.sub{margin:0 0 14px;color:#334}
.video{aspect-ratio:16/9;background:var(--ink);border-radius:10px;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
.video iframe{width:100%;height:100%;border:0}
.bicente{display:flex;gap:12px;align-items:center;background:var(--mist);border-left:6px solid var(--navy);padding:10px 14px;border-radius:8px;margin:12px 0;font-style:italic}
.bicente .av{font-size:2rem}
.bicente .av img{width:52px;height:52px;object-fit:contain}
.card h3{margin:0 0 4px;color:var(--navy);font-size:1.1rem}
.tag{display:inline-block;background:var(--ink);color:#fff;font:700 .72rem "Trebuchet MS",sans-serif;padding:2px 10px;border-radius:12px;margin:0 4px 8px 0}
.card p{margin:6px 0}
label.f{display:block;font:700 .85rem "Trebuchet MS",sans-serif;margin:12px 0 4px;color:var(--navy)}
input[type=text],textarea,select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:8px;font:1rem Georgia,serif;background:#fff}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--navy2);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:18px;padding:5px 12px;font:.82rem "Trebuchet MS",sans-serif;cursor:pointer}
.chip.sel{background:var(--navy);color:#fff}
.chip.static{cursor:default;border-color:var(--line);color:#445}
.msg{font:.85rem "Trebuchet MS",sans-serif;margin-top:8px;color:var(--bad);min-height:1em}
.count{font:800 2.4rem "Trebuchet MS",sans-serif;color:var(--navy);margin:8px 0}
.q{margin:16px 0;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.q p{font-weight:700;margin:0 0 6px}
.opt{display:block;padding:8px 10px;border:2px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer}
.opt.right{border-color:var(--ok);background:#eaf7f0}
.opt.wrong{border-color:var(--bad);background:#fbeded}
.cert{border:6px double var(--navy);padding:26px 16px;text-align:center;background:#fff;margin-top:14px}
.cert h2{font-size:1.6rem;color:var(--navy);margin:6px 0}
.cert img{height:70px}
.win{text-align:center;padding:10px 0}
.win .big{font-size:4rem}
.tlogo{background:#fff;color:#0b1f4b;border-radius:10px;padding:7px 11px;font:800 .8rem/1.1 "Trebuchet MS",sans-serif;text-align:center;letter-spacing:.5px}
.reset{display:block;margin:22px auto 0}
.pop{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font:700 .95rem "Trebuchet MS",sans-serif;transition:transform .4s;z-index:60;text-align:center;max-width:90vw}
.pop.show{transform:translateX(-50%) translateY(0)}
@media(max-width:520px){.nl{width:112px;font-size:.66rem}.banner b{font-size:.9rem}.fig .in{font-size:48px}.medal{width:64px}.medal .c{width:48px;height:48px;font-size:1.4rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{main,.hud,.xbtn,.noprint,.pop{display:none!important}.overlay{position:static!important;display:block!important;background:none;padding:0}.panel{border:0}body{background:#fff}}
</style>
</head>

<div class="hud" id="hud"><img data-i="logo" alt="" onerror="noLogo(this)"><span id="hlead"></span><button class="btn" data-go>Continuar</button></div>

  <div class="board" id="board">

  <button class="btn alt reset" data-reset>Reiniciar mi progreso</button>
</main>
<div class="overlay" id="ov"><div class="panel" id="panel" tabindex="-1"><button class="xbtn" data-close aria-label="Cerrar">✕</button><div id="pbody"></div></div></div>

 {id:"4.3",t:"Las 3 Preguntas de Oro",tp:"Guía para Conversaciones",d:"1) ¿Sabes de alguna vacante o oportunidad en el campo que me interesa? 2) ¿Conoces a alguien más con quien valga la pena que hable? 3) ¿Puedo mantenerte al tanto de cómo me va para seguir en contacto?",f:[
  {k:"t",l:"¿A quién le haré estas 3 preguntas primero?"},
  {k:"c",l:"Me aprendí las 3 preguntas para cada interacción profesional"}]},
 {id:"4.4",t:"El Mensaje de Gratitud",tp:"Misión de Seguimiento",d:"Escribe una plantilla breve para enviar después de hablar con un contacto.",f:[
  {k:"a",l:"Un agradecimiento sincero por su tiempo"},
  {k:"a",l:"Algo específico que conversaron"},
  {k:"a",l:"Un paso siguiente sugerido o promesa de actualización"}]}],
 quiz:[
 {q:"¿Qué representan los contactos con clasificación «C»?",o:["Contactos que debes descartar de inmediato.","Personas que tal vez no están en tu área laboral, pero te pueden conectar con alguien más.","Contactos prioritarios a los que debes llamar primero."],a:1},
 {q:"¿Por qué es fundamental enviar un mensaje de agradecimiento tras hablar con un contacto?",o:["Porque demuestra educación, genera un impacto positivo y hace que te recuerden con cariño.","Porque es obligatorio por ley.","Para exigirles que te den trabajo rápido."],a:0}]}
];
const FINAL_SAY="¡Lo lograste! Ya recorriste las cuatro etapas: conoces tus talentos, elegiste una dirección, identificaste lo que necesitas y empezaste a construir tu manada. El camino profesional no es una línea recta, es como cruzar la pradera. ¡Gracias por caminar este tramo conmigo!";

/* ===== ESTADO ===== */
const KEY="bha_descubre_talentos_v2";
let S={cards:{},quiz:{},intro:{},grad:false,name:""};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const XPI=5,XPC=10,XPQ=25,XPG=50;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const $=id=>document.getElementById(id);
const quizOk=n=>!!(S.quiz[n]&&S.quiz[n].passed);

/* ===== ESTACIONES ===== */
const ST=[];
C.forEach(ch=>{
  ST.push({t:"intro",n:ch.n,lb:"Bienvenida",sym:ch.ic});
  ch.cards.forEach(c=>ST.push({t:"card",n:ch.n,card:c,id:c.id,lb:c.t,sym:c.id}));
  ST.push({t:"quiz",n:ch.n,lb:"Quiz del capítulo "+ch.n,sym:"❓"});
});
ST.push({t:"final",lb:"Graduación",sym:"🎓"});
const isDone=s=>s.t==="intro"?!!S.intro[s.n]:s.t==="card"?!!(S.cards[s.id]&&S.cards[s.id].done):s.t==="quiz"?quizOk(s.n):!!S.grad;
const firstOpen=()=>{const i=ST.findIndex(s=>!isDone(s));return i<0?ST.length-1:i};
const xp=()=>ST.reduce((a,s)=>a+(isDone(s)?({intro:XPI,card:XPC,quiz:XPQ,final:XPG})[s.t]:0),0);

function badgeList(){
  const first=Object.values(S.cards).some(c=>c.done);
  const perfect=Object.values(S.quiz).some(q=>q.passed&&q.tries===1);
  const L=[{i:"👣",n:"Primer Paso",g:first}];
  C.forEach(c=>L.push({i:c.ic,n:c.badge,g:quizOk(c.n)}));
  L.push({i:"🎯",n:"Sin Errores",g:perfect},{i:"🎓",n:"Bisonte Graduado",g:S.grad});
  return L;
}
function pop(t){const p=$("pop");p.textContent=t;p.classList.add("show");clearTimeout(pop.t);pop.t=setTimeout(()=>p.classList.remove("show"),2600)}

/* ===== MAPA ===== */
const ZONES=C.map((c,k)=>({i:c.ic,s:"Capítulo "+c.n,t:c.t,
  e:[["🌾","🌿","🪨","☁️"],["🌲","⛰️","💨","🌲"],["🌊","🪵","🐟","💧"],["🦬","🌾","🦬","🌄"]][k],
  bg:["linear-gradient(#f6f8fd,#e6edfa)","linear-gradient(#e6edfa,#d3def4)","linear-gradient(#d3def4,#bccbec)","linear-gradient(#bccbec,#e6edfa)"][k]}))
  .concat([{i:"🎓",s:"Meta final",t:"Graduación en la cima",e:["🏔️","⭐","🌄","⭐"],bg:"linear-gradient(#e6edfa,#0b1f4b 35%,#05070d)"}]);
const LV=[[0,"Cría de Bisonte"],[50,"Caminante"],[130,"Explorador"],[220,"Guía de la Manada"],[320,"Bisonte Graduado"]];
let figIdx=firstOpen(),G=null;

function geo(){
  const w=$("board").clientWidth,mob=w<520,d=mob?66:80,rowH=mob?140:156,ban=mob?84:96,xs=[.27,.73];
  let y=0,k=0;const pos=[],bands=[];
  ST.forEach(s=>{
    if(s.t==="intro"||s.t==="final"){
      if(bands.length){y+=84;bands[bands.length-1].y2=y}
      bands.push({y1:y});y+=ban+d/2+14;k=0;
    }else y+=rowH;
    pos.push({x:w*xs[k%2],y});k++;
  });
  bands[bands.length-1].y2=y+130;
  return{pos,bands,d,w,mob,ban,h:y+130};
}
function placeFig(anim){
  const f=$("fig"),p=G.pos[figIdx],r=G.d*(ST[figIdx].t==="final"?.65:.5);
  if(!anim)f.style.transition="none";
  f.style.left=p.x+"px";f.style.top=(p.y-r+26)+"px";f.style.setProperty("--fs",(G.mob?68:84)+"px");
  if(!anim){void f.offsetWidth;f.style.transition=""}
}
function drawMap(){
  G=geo();const cur=firstOpen(),B=$("board");
  B.style.height=G.h+"px";B.style.setProperty("--d",G.d+"px");
  let h="";
  G.bands.forEach((b,i)=>{
    const z=ZONES[i],n=Math.max(3,Math.round((b.y2-b.y1)/(G.mob?150:130)));
    h+=`<div class="band" style="top:${b.y1}px;height:${b.y2-b.y1}px;background:${z.bg}"></div>`;
    for(let j=0;j<n;j++){const yy=b.y1+G.ban+30+(b.y2-b.y1-G.ban-60)*(j+.5)/n;
      h+=`<span class="scn" style="top:${yy}px;${j%2?"right":"left"}:${G.mob?4:14}px;font-size:${G.mob?22:34}px">${z.e[j%z.e.length]}</span>`}
    h+=`<div class="banner" style="top:${b.y1+12}px"><span class="e">${z.i}</span><div><small>${z.s}</small><b>${esc(z.t)}</b></div></div>`;
  });
  let bd="",fl="",dz="";
  for(let i=0;i<ST.length-1;i++){
    const a=G.pos[i],b=G.pos[i+1],m=(a.y+b.y)/2,dn=isDone(ST[i]);
    const p=`M${a.x} ${a.y}C${a.x} ${m} ${b.x} ${m} ${b.x} ${b.y}`;
    bd+=`<path d="${p}" stroke="${dn?"#05070d":"#8c9bc0"}" stroke-width="44"/>`;
    fl+=`<path d="${p}" stroke="${dn?"#16336e":"#e3e9f7"}" stroke-width="34"/>`;
    dz+=`<path d="${p}" stroke="${dn?"#fff":"#8c9bc0"}" stroke-width="3" stroke-dasharray="3 12"/>`;
  }
  h+=`<svg width="${G.w}" height="${G.h}" style="position:absolute;left:0;top:0" fill="none" stroke-linecap="round" aria-hidden="true">${bd}${fl}${dz}</svg>`;
  h+=ST.map((s,i)=>{
    const st=isDone(s)?"done":i===cur?"cur":i>cur?"lock":"",side=G.pos[i].x>G.w/2?"l":"r";
    const sm=s.t==="intro"?"Capítulo "+s.n+" · video":s.t==="card"?"Tarjeta "+s.id:s.t==="quiz"?"Quiz del capítulo "+s.n:"Meta final";
    return `<button class="node ${s.t==="quiz"?"quiz":s.t==="final"?"final":""} ${st}" data-s="${i}" style="left:${G.pos[i].x}px;top:${G.pos[i].y}px" aria-label="${esc(s.lb)}${st==="lock"?" (bloqueada)":""}"><span class="sym">${s.sym}</span><span class="nl ${side}"><small>${sm}</small>${esc(s.lb)}</span></button>`}).join("");
  $("layer").innerHTML=h;placeFig(false);
}
function hopTo(t,cb){
  if(figIdx===t){cb&&cb();return}
  const f=$("fig"),k=Math.abs(t-figIdx),few=k<=3,ms=few?450:800;
  figIdx+=few?(t>figIdx?1:-1):(t-figIdx);
  f.style.setProperty("--hd",ms+"ms");placeFig(true);
  const inn=f.firstElementChild;inn.classList.remove("hop");void inn.offsetWidth;inn.classList.add("hop");
  f.scrollIntoView({block:"center",behavior:"smooth"});
  setTimeout(()=>hopTo(t,cb),ms+40);
}
function head(){
  const d=ST.filter(isDone).length,pc=Math.round(d/ST.length*100),x=xp();
  let li=0;LV.forEach((l,i)=>{if(x>=l[0])li=i});
  const nx=LV[li+1],lp=nx?Math.round((x-LV[li][0])/(nx[0]-LV[li][0])*100):100;
  const cd=ST.filter(s=>s.t==="card"&&isDone(s)).length,nc=ST.filter(s=>s.t==="card").length,qd=ST.filter(s=>s.t==="quiz"&&isDone(s)).length,circ=2*Math.PI*30;
  $("tiles").innerHTML=
   `<div class="tile"><svg class="ring" width="74" height="74" viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="30" fill="none" stroke="#ffffff30" stroke-width="8"/><circle cx="37" cy="37" r="30" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pc/100)}" transform="rotate(-90 37 37)"/><text x="37" y="42" text-anchor="middle">${pc}%</text></svg><div><small>Camino recorrido</small><b>${d}/${ST.length}</b></div></div>`+
   `<div class="tile"><div><small>Nivel</small><b style="font-size:1.05rem">${LV[li][1]}</b><div class="bar"><i style="width:${lp}%"></i></div></div></div>`+
   `<div class="tile"><div><small>Puntos de experiencia</small><b>${x} XP</b></div></div>`+
   `<div class="tile"><div><small>Tarjetas · Quizzes</small><b>${cd}/${nc} · ${qd}/${C.length}</b></div></div>`;
  $("medals").innerHTML=badgeList().map(b=>`<div class="medal ${b.g?"got":""}"><div class="c"><span>${b.i}</span></div>${esc(b.n)}</div>`).join("");
  $("lead").textContent=$("hlead").textContent=ST.every(isDone)?"¡Completaste todo el camino!":"Siguiente estación: "+ST[firstOpen()].lb;
}
function confetti(){for(let i=0;i<34;i++){const c=document.createElement("div");c.className="cf";c.style.left=Math.random()*100+"vw";c.style.background=["#0b1f4b","#fff","#05070d","#2f5bc0"][i%4];c.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2700)}}

/* ===== PIEZAS ===== */
function videoBlock(key,caption){
  const u=VIDEOS[key]||"",m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  const body=m?`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="${esc(caption)}" allowfullscreen></iframe>`
   :`<div><div style="font-size:2.4rem">🎬</div><b class="ui">Video próximamente</b><div style="opacity:.8;font-size:.9rem">${esc(caption)}</div></div>`;
  return `<div class="video">${body}</div>`;
}
const bicente=t=>`<div class="bicente"><span class="av"><img src="${IMG.fig}" alt="" onerror="this.replaceWith(document.createTextNode('🦬'))"></span><span>«${esc(t)}» <b>— Bicente</b></span></div>`;
function fieldHTML(card,f,i){
  const v=((S.cards[card.id]||{}).v||{})[i],id=`${card.id}_${i}`;
  const L=`<label class="f" for="${id}">${esc(f.l)}</label>`,a=`id="${id}" data-c="${card.id}" data-i="${i}"`;
  if(f.k==="t")return L+`<input type="text" ${a} placeholder="${esc(f.p||"")}" value="${esc(v||"")}">`;
  if(f.k==="a")return L+`<textarea ${a} placeholder="${esc(f.p||"")}">${esc(v||"")}</textarea>`;
  if(f.k==="s")return L+`<select ${a}><option value="">Elige...</option>${f.o.map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join("")}</select>`;
  if(f.k==="c")return `<label class="f" style="font-weight:400"><input type="checkbox" data-c="${card.id}" data-i="${i}" data-chk ${v?"checked":""}> ${esc(f.l)}</label>`;
  if(f.k==="m"){const sel=v||[];return L+`<div class="chips">${f.o.map(o=>`<button type="button" class="chip ${sel.includes(o)?"sel":""}" data-c="${card.id}" data-i="${i}" data-m="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("")}</div><small class="ui">Elige entre ${f.min} y ${f.max}.</small>`}
  if(f.k==="x")return `<div class="count" id="cnt_${card.id}">⏱ 3</div><button type="button" class="btn alt" style="margin-top:0" data-timer="${card.id}">¡Iniciar mis 3 segundos!</button>`+L+`<input type="text" ${a} placeholder="${esc(f.p||"")}" value="${esc(v||"")}">`;
}
function findCard(id){for(const c of C)for(const k of c.cards)if(k.id===id)return k}
function stHTML(s){
  if(s.t==="intro"){const ch=C[s.n-1];
    return `<h2>${ch.ic} Capítulo ${ch.n}: ${esc(ch.t)}</h2><p class="sub">${esc(ch.vid)}</p>${videoBlock(ch.n,"Video "+ch.n+" · "+ch.t)}${bicente(ch.say)}<button class="btn" data-intro="${ch.n}">${S.intro[ch.n]?"Seguir adelante":"¡Vamos, Bicente!"}</button>`}
  if(s.t==="card"){const c=s.card,d=S.cards[c.id]&&S.cards[c.id].done;
    return `<div class="card"><span class="tag">Tarjeta ${c.id}</span><span class="tag" style="background:var(--navy)">${esc(c.tp)}</span>${d?'<span class="tag">✔ completada</span>':""}
    <h3>${esc(c.t)}</h3><p>${esc(c.d)}</p>
    ${c.chips?`<div class="chips">${c.chips.map(x=>`<span class="chip static">${x}</span>`).join("")}<span class="chip static">…y muchos más</span></div>`:""}
    ${c.f.map((f,i)=>fieldHTML(c,f,i)).join("")}
    <button class="btn" data-done="${c.id}">${d?"Actualizar tarjeta":"Completar tarjeta (+"+XPC+" XP)"}</button><div class="msg" id="msg"></div></div>`}
  if(s.t==="quiz"){const ch=C[s.n-1];
    if(quizOk(s.n))return `<div class="win"><div class="big">${ch.ic}</div><h2 style="margin:0">¡Quiz aprobado!</h2><p>Ya tienes la insignia <b>${esc(ch.badge)}</b>.</p><button class="btn" data-close>Seguir el camino</button></div>`;
    return `<h2>❓ Quiz del Capítulo ${ch.n}</h2><p class="sub">Responde todo bien para ganar la insignia <b>${esc(ch.badge)}</b> (+${XPQ} XP). Puedes intentarlo las veces que quieras.</p>
    ${ch.quiz.map((it,qi)=>`<div class="q"><p>${qi+1}. ${esc(it.q)}</p>${it.o.map((o,oi)=>`<label class="opt" id="o_${qi}_${oi}"><input type="radio" name="q${qi}" value="${oi}"> ${esc(o)}</label>`).join("")}</div>`).join("")}
    <button class="btn" data-quiz="${ch.n}">Comprobar respuestas</button><div class="msg" id="msg"></div>`}
  return `<h2>🎓 Graduación</h2>${videoBlock("final","Video final · Cierre del curso")}${bicente(FINAL_SAY)}
   ${S.grad?`<div class="cert"><img src="${IMG.logo}" alt="" onerror="noLogo(this)"><p class="ui">Big Horn Academy certifica que</p><h2>${esc(S.name)}</h2><p>completó el curso <b>Descubre Tus Talentos y Tu Camino Profesional</b>:<br>conoce sus talentos, eligió una dirección, identificó lo que necesita y construyó su manada.</p><p class="ui">${new Date().toLocaleDateString("es-MX",{year:"numeric",month:"long",day:"numeric"})}</p></div><button class="btn noprint" onclick="window.print()">Imprimir certificado</button>`
   :`<p class="sub">Escribe tu nombre completo para recibir tu certificado y la insignia final (+${XPG} XP).</p><label class="f" for="nm">Nombre completo</label><input type="text" id="nm" value="${esc(S.name)}"><button class="btn" data-grad>Obtener mi certificado</button><div class="msg" id="msg"></div>`}`;
}

/* ===== MODAL ===== */
function openStation(i){
  $("pbody").innerHTML=stHTML(ST[i]);$("ov").classList.add("on");document.body.style.overflow="hidden";$("ov").scrollTop=0;$("panel").focus();
}
function closeModal(){
  if(!$("ov").classList.contains("on"))return;
  $("ov").classList.remove("on");document.body.style.overflow="";
  drawMap();head();hopTo(firstOpen());
}

/* ===== EVENTOS ===== */
document.addEventListener("click",e=>{
  if(e.target.id==="ov"){closeModal();return}
  const t=e.target.closest("button");if(!t)return;
  const D=t.dataset;
  if(D.s!==undefined){
    const i=+D.s;
    if(i>firstOpen()){pop("🔒 Completa primero la estación anterior");return}
    hopTo(i,()=>openStation(i));
  }
  else if(t.hasAttribute("data-go")){const i=firstOpen();hopTo(i,()=>openStation(i))}
  else if(t.hasAttribute("data-close"))closeModal();
  else if(D.intro){S.intro[D.intro]=true;save();pop("🦬 ¡Capítulo "+D.intro+" en marcha! +"+XPI+" XP");closeModal()}
  else if(D.m!==undefined){
    const c=findCard(D.c),i=+D.i,f=c.f[i];
    const st=(S.cards[c.id]=S.cards[c.id]||{v:{}});st.v=st.v||{};let sel=st.v[i]||[];const o=D.m;
    if(sel.includes(o))sel=sel.filter(x=>x!==o);else if(sel.length<f.max)sel=sel.concat(o);else{pop("Máximo "+f.max+" opciones");return}
    st.v[i]=sel;save();
    t.parentElement.querySelectorAll(".chip").forEach(b=>{const on=sel.includes(b.dataset.m);b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on)});
  }
  else if(D.timer){
    const id=D.timer,el=$("cnt_"+id);let n=3;el.textContent="⏱ "+n;t.disabled=true;
    const iv=setInterval(()=>{n--;if(n>0)el.textContent="⏱ "+n;else{clearInterval(iv);el.textContent="¡Tiempo! Escríbelo ya";t.disabled=false;const inp=$(id+"_0");inp&&inp.focus()}},1000);
  }
  else if(D.done)completeCard(D.done);
  else if(D.quiz)checkQuiz(+D.quiz);
  else if(t.hasAttribute("data-grad")){
    const nm=$("nm").value.trim();
    if(nm.length<3){$("msg").textContent="Escribe tu nombre completo.";return}
    S.name=nm;S.grad=true;save();$("pbody").innerHTML=stHTML(ST[ST.length-1]);pop("🎓 ¡Bisonte Graduado! +"+XPG+" XP");confetti();
  }
  else if(t.hasAttribute("data-reset")){if(confirm("¿Borrar todo tu progreso y respuestas?")){S={cards:{},quiz:{},intro:{},grad:false,name:""};save();figIdx=0;drawMap();head();window.scrollTo(0,0)}}
});
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset||!t.dataset.c||t.dataset.m!==undefined)return;
  const st=(S.cards[t.dataset.c]=S.cards[t.dataset.c]||{v:{}});st.v=st.v||{};
  st.v[t.dataset.i]=t.hasAttribute("data-chk")?t.checked:t.value;save();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{drawMap()},150)});

function completeCard(id){
  const card=findCard(id),st=(S.cards[id]=S.cards[id]||{v:{}});st.v=st.v||{};
  for(let i=0;i<card.f.length;i++){
    const f=card.f[i],v=st.v[i];
    const bad=f.k==="m"?!(v&&v.length>=f.min):f.k==="c"?!v:!(v&&String(v).trim().length>0);
    if(bad){$("msg").textContent=f.k==="m"?"Elige al menos "+f.min+" opciones.":"Falta completar: "+f.l;return}
  }
  const was=st.done;st.done=true;save();
  pop(was?"Tarjeta actualizada":"✔ Tarjeta "+id+" completada +"+XPC+" XP");
  closeModal();
}
function checkQuiz(n){
  const ch=C[n-1];let ok=0;
  ch.quiz.forEach((it,qi)=>{
    const sel=document.querySelector(`input[name=q${qi}]:checked`);
    it.o.forEach((_,oi)=>$(`o_${qi}_${oi}`).classList.remove("right","wrong"));
    if(sel){const v=+sel.value;if(v===it.a){ok++;$(`o_${qi}_${v}`).classList.add("right")}else $(`o_${qi}_${v}`).classList.add("wrong")}
  });
  const q=S.quiz[n]=S.quiz[n]||{tries:0,passed:false};
  q.tries=(q.tries||0)+1;
  if(ok===ch.quiz.length){q.passed=true;save();pop("🏅 Insignia «"+ch.badge+"» +"+XPQ+" XP");confetti();$("pbody").innerHTML=stHTML(ST.find(s=>s.t==="quiz"&&s.n===n));return}
  save();$("msg").textContent=`Acertaste ${ok} de ${ch.quiz.length}. Revisa las respuestas en rojo y vuelve a intentarlo.`;
}

document.querySelectorAll("img[data-i]").forEach(m=>{m.src=IMG[m.dataset.i]});
$("who").value=S.name||"";
$("who").addEventListener("input",e=>{S.name=e.target.value;save()});
new IntersectionObserver(([e])=>$("hud").classList.toggle("on",!e.isIntersecting)).observe($("dash"));
drawMap();head();
if(ST.some(isDone))setTimeout(()=>$("fig").scrollIntoView({block:"center"}),200);
</script>
</body>
